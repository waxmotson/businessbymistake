<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="https://waxstatic.onrender.com/inkdin%20rethink%20the%20bs.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="BUSINESS BY MISTAKE">
  <meta property="og:description" content="all of the HSC Business Studies multiple choice questions">

  <title>BUSINESS BY MISTAKE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
  <style>
    @font-face { font-family: 'Tomkins Display'; src: url('TomkinsDisplay-Regular.woff2') format('woff2'); font-display: swap; }
    h1, h2, h3 { font-family: 'Tomkins Display', 'Bricolage Grotesque', sans-serif; font-weight: normal; }
  </style>
  <style>
    body {
      font-family: 'Bricolage Grotesque', sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
      background-color: rgb(29, 32, 31);
      color: white;
    }
    h1 {
      font-size: 3rem;
      word-break: break-all;
      color: aqua;
    }
    h2 { font-size: 2rem; }
    h3 {
      font-style: italic;
      color: burlywood;
    }
    img {
      max-width: 100%;
      max-height: 40vh;
      border: 1px solid #ccc;
      margin: 20px 0;
    }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 20px 0;
    }
    button {
      font-size: 1.4rem;
      padding: 12px 28px;
      cursor: pointer;
    }
    #result {
      font-size: 2rem;
      margin-top: 24px;
      font-weight: bold;
    }
    .topic-picker {
      margin: 18px 0 12px;
    }
    .topic-picker-label {
      margin: 0 0 10px;
      color: burlywood;
      font-size: 1.05rem;
    }
    .topic-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
    }
    .topic-button {
      border: 2px solid aqua;
      border-radius: 8px;
      background: transparent;
      color: white;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 9px 14px;
      transition: background-color 120ms ease, color 120ms ease;
    }
    .topic-button:hover { border-color: burlywood; }
    .topic-button.selected {
      background: aqua;
      color: rgb(29, 32, 31);
    }
    .topic-button:focus-visible {
      outline: 3px solid burlywood;
      outline-offset: 3px;
    }
    #topic-status {
      color: burlywood;
      font-size: 0.95rem;
      margin: 9px 0 0;
    }
    @media (max-width: 520px) {
      .topic-button {
        flex: 1 1 42%;
        font-size: 0.95rem;
        padding: 9px 8px;
      }
    }
  </style>
</head>
<body>
  <div class="flex-container">
    <h2>BUSINESS BY MISTAKE</h2>
    <div class="topic-picker">
      <p class="topic-picker-label">SELECT A HSC BUSINESS STUDIES TOPIC</p>
      <div class="topic-buttons" role="group" aria-label="Choose a Business Studies topic">
        <button class="topic-button" type="button" data-topic="operations" onclick="selectTopic('operations')" aria-pressed="false">Operations</button>
        <button class="topic-button" type="button" data-topic="marketing" onclick="selectTopic('marketing')" aria-pressed="false">Marketing</button>
        <button class="topic-button" type="button" data-topic="finance" onclick="selectTopic('finance')" aria-pressed="false">Finance</button>
        <button class="topic-button" type="button" data-topic="human-resources" onclick="selectTopic('human-resources')" aria-pressed="false">Human Resources</button>
        <button class="topic-button" type="button" data-topic="all" onclick="selectTopic('all')" aria-pressed="false">All Topics</button>
      </div>
      <p id="topic-status" aria-live="polite"></p>
    </div>
    <h1 id="title"></h1>
  </div>

  <img id="question-img" alt="Question">

  <div class="buttons">
    <button onclick="check('A')">A</button>
    <button onclick="check('B')">B</button>
    <button onclick="check('C')">C</button>
    <button onclick="check('D')">D</button>
  </div>

  <h2 id="result"></h2>
  <h3 id="message"></h3>

  <button id="reloader" hidden="true" onclick="window.location.reload();">NEXT</button>
  <script src="streak.js"></script>
  <script src="answers.js"></script>
  <script src="topics.js"></script>
  <script src="main.js"></script>
</body>
</html>
